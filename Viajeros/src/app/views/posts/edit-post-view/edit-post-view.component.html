<app-navbar/>
<div class="container-fluid bg-dark">
    <div class="row">
        <div class="col-0 col-lg-4"></div>
        <div class="col-12 col-lg-4">
            <div class="modal-content bg-dark mt-5">
                <h1 class="text-center fs-5" [attr.id]="post.date">Modificar Post</h1>

                <form [formGroup]="postForm">
                    <div class="modal-body">
                        <mat-form-field class="col-12 p-3 pb-0 pt-0">
                            <mat-label>Titulo</mat-label>
                            <input matInput id="title" name="title" class=" mb-2" formControlName="Title"
                                placeholder="Ingrese el titulo" required>
                        </mat-form-field>

                        <mat-form-field class="col-12 p-3 pb-0 pt-0">
                            <mat-label>Descripcion</mat-label>
                            <textarea matInput id="description" name="description" class="mb-0"
                                formControlName="Description" required></textarea>
                        </mat-form-field>
                    </div>
                    <section class="p-3 pb-0 pt-0">
                        <ngx-dropzone (change)="onSelect($event)" accept="image/jpeg,image/jpg,image/png"
                            style="background-color: #4a4a4a;">
                            <ngx-dropzone-label class="text-light">Arrastra las imagenes</ngx-dropzone-label>
                            <ngx-dropzone-image-preview ngProjectAs="ngx-dropzone-preview" *ngFor="let f of files"
                                [file]="f">
                                <ngx-dropzone-label>{{ f.name }} ({{ f.type }})</ngx-dropzone-label>
                            </ngx-dropzone-image-preview>
                        </ngx-dropzone>
                    </section>
                    <div class="modal-footer mt-3 mb-3">
                        <button mat-button color="warn" data-bs-dismiss="modal" aria-label="Close" class="me-3 p-3"><mat-icon
                                fontIcon="close" color="warn" />Cancelar</button>
                        <button mat-raised-button color="accent" (click)="updatePost()" data-bs-dismiss="modal"
                            aria-label="Edit">
                            <mat-icon fontIcon="check" color="dark" />

                            Modificar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<app-footer/>
