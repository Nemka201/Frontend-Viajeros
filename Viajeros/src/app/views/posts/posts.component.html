<app-navbar/>
<div class="container-fluid bg-dark">
    <div class="row">
      <div class="col-12 col-lg-6 border-right mt-5">
        <app-add-post-view/>
      </div>
      <div class="col-12 col-lg-6 mt-5">
        <h2 class="text-center text-light mt-0">Todos los Posts</h2>
        <table mat-table [dataSource]="posts" class="mt-2">
  
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Indice </th>
            <td mat-cell *matCellDef="let row"> {{ row.id }} </td> </ng-container>
        
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef> TItulo </th>
            <td mat-cell *matCellDef="let row"> {{ row.title }} </td> </ng-container>
        
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Descripción </th>
            <td mat-cell *matCellDef="let row"> {{ truncateDescription(row.description) }} </td> </ng-container>
        
          <ng-container matColumnDef="created">
            <th mat-header-cell *matHeaderCellDef> Fecha de creación </th>
            <td mat-cell *matCellDef="let row"> {{row.created | date:'dd/MM/yyyy'}} </td> </ng-container>
        
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let row">
              <a mat-icon-button [routerLink]="['/Posts', row.id]">
                <mat-icon>edit</mat-icon>
              </a>
              <button mat-icon-button (click)="deletePost(row.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="['id', 'title', 'description', 'created', 'actions']"></tr>
        
          <tr mat-row *matRowDef="let row; columns: ['id', 'title', 'description', 'created', 'actions'];"></tr>
        
        </table>
        <mat-paginator [length]="totalPosts" [pageSize]="pageSize" (page)="handlePageEvent($event)" aria-label="Select page"/>
      </div>
    </div>
    <div class="row">
      <div class="col-6">
      </div>
    </div>
  </div>
<app-footer/>
