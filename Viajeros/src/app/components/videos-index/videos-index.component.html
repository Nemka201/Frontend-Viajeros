<section class="container-fluid video-index" id="programas">
  <div class="row">
    <h2 class="text-center mt-5">Videos</h2>
    <div class="col-12 col-lg-6 mt-5">
      <a href="/Videos" *ngIf="isLogged">

        <button mat-raised-button color="primary" aria-label="Add video" class="mt-3 m-5 mb-0 mt-0">
          <mat-icon fontIcon="add" color="" class="text-center ms-2" />

        </button>
      </a>
      <app-video-card [videoUrl]="lastVideos[0].videoLink"></app-video-card>
    </div>
    <div class="col-12 col-lg-6 mt-5 pb-5">
      <div class="d-flex ps-5 pe-5">
        <input class="form-control me-2 input-search" type="search" placeholder="Buscar" aria-label="Search"
               [(ngModel)]="searchTerm" (keyup.enter)="handleSearch()">
        <app-tags (filterEvent)="onFilterByTags($event)"/>
      </div>
      <div class="row mt-5">
        <div *ngFor="let video of displayedVideos.slice(0, 4)" class="col-5 ms-2 mt-3">
          <app-mosaic-video [videoUrl]="video.videoLink"></app-mosaic-video>
        </div>
      </div>
    </div>
  </div>
</section>
