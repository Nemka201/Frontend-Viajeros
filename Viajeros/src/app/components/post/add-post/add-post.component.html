<!-- Button trigger modal -->
<div class="text-end">
  <button mat-raised-button color="primary" data-bs-toggle="modal" data-bs-target="#addPostModal" aria-label="AddPost"
    class="mt-3">
    <mat-icon fontIcon="add" color="" />
    Agregar
  </button>
</div>


<!-- Modal -->
<div class="modal fade text-dark" id="addPostModal" tabindex="-1" aria-labelledby="addPostModal" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5 text-center" id="addPostModal">Agregar Post</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form [formGroup]="postForm">
        <div class="modal-body">
          <mat-form-field class="col-12">
            <mat-label>Titulo</mat-label>
          <input matInput id="title" name="title" class=" mb-2" formControlName="title"
          placeholder="Ingrese el titulo" required>
          </mat-form-field>
        
          <mat-form-field class="col-12">
            <mat-label>Descripcion</mat-label>
            <textarea matInput id="description" name="description" class="mb-0 " formControlName="description"
            required></textarea>
          </mat-form-field>
          <!-- <mat-label class="form-label" for="title">Titulo:</mat-label>
          <input type="text" id="title" name="title" class="form-control mb-2" formControlName="title"
            placeholder="Ingrese el titulo" required />
          <mat-label  for="description">Descripción:</mat-label>
          <textarea matInput id="description" name="description" class="form-control " formControlName="description"
            required></textarea> -->

        </div>
        <section class="p-3">
          <ngx-dropzone (change)="onSelect($event)" accept="image/jpeg,image/jpg,image/png" style="background-color: #4a4a4a;">
            <ngx-dropzone-label class="text-light">Arrastra las imagenes</ngx-dropzone-label>
            <ngx-dropzone-image-preview ngProjectAs="ngx-dropzone-preview" *ngFor="let f of files" [file]="f">
              <ngx-dropzone-label>{{ f.name }} ({{ f.type }})</ngx-dropzone-label>
            </ngx-dropzone-image-preview>
          </ngx-dropzone>
        </section>
        <div class="modal-footer">
          <button mat-stroked-button color="warn" data-bs-dismiss="modal" aria-label="Close"> <mat-icon fontIcon="close"
              color="warn" />
            Cancelar</button>
          <button mat-flat-button color="accent" (click)="AddPost()" aria-label="AddButton"> <mat-icon fontIcon="check"
              color="dark" />
            Agregar</button>
        </div>
      </form>
    </div>
  </div>
</div>
